name: iptv_flutter_app
description: A professional IPTV player supporting Xtream Codes.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  muxa_xtream: ^0.1.1
  http: ^1.2.0
  shared_preferences: ^2.2.2
  media_kit: ^1.1.10
  media_kit_video: ^1.2.4
  media_kit_libs_video: ^1.0.4
  carousel_slider: ^4.2.1
  smooth_page_indicator: ^1.1.0
  local_pip: ^1.1.0
  airo_m3u_parser: ^1.0.0
  libtorrent_flutter: ^1.9.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "app_icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - app_icon.png
